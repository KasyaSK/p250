<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P250 Room 014 · Viewer</title><style>body{margin:0;background:#162324;color:#ecf1e8;font:15px system-ui}header{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#233735}input,button{padding:9px;background:#38514c;color:white;border:1px solid #81938d;border-radius:6px}#scene{height:calc(100vh - 110px)}#status{padding:9px}label{cursor:pointer}</style><header><b>P250 · Кімната 014 · v13.4.1</b><label>Вибрати модель GLB <input type="file" id="glb" accept=".glb"></label><label>Маніфест JSON <input type="file" id="json" accept=".json"></label><button id="reset">Повернути камеру</button></header><div id="status">Виберіть файл room_014_instances.glb із архіву v13.4. Маніфест необов'язковий.</div><div id="scene"></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{OrbitControls}from'three/addons/controls/OrbitControls.js';const el=document.getElementById('scene'),status=document.getElementById('status'),scene=new THREE.Scene();scene.background=new THREE.Color('#233032');const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.01,500);camera.position.set(8,7,10);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(el.clientWidth,el.clientHeight);el.append(renderer.domElement);const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2.5));const light=new THREE.DirectionalLight(0xffe4c8,2.5);light.position.set(5,9,6);scene.add(light);let model;const frame=()=>{requestAnimationFrame(frame);orbit.update();renderer.render(scene,camera)};frame();function focus(){if(!model)return;const b=new THREE.Box3().setFromObject(model),c=b.getCenter(new THREE.Vector3()),s=b.getSize(new THREE.Vector3()).length();orbit.target.copy(c);camera.position.copy(c.clone().add(new THREE.Vector3(s*.7,s*.5,s*.8)));orbit.update()}document.getElementById('reset').onclick=focus;document.getElementById('glb').onchange=async e=>{const file=e.target.files[0];if(!file)return;status.textContent='Завантаження '+file.name;const url=URL.createObjectURL(file);new GLTFLoader().load(url,g=>{if(model)scene.remove(model);model=g.scene;scene.add(model);focus();let count=0,tri=0;model.traverse(o=>{if(o.isMesh){count++;tri+=o.geometry.index?o.geometry.index.count/3:o.geometry.attributes.position.count/3}});status.textContent='Модель завантажено: '+count+' сіток, '+Math.round(tri)+' трикутників. ЛКМ — обертання, коліщатко — масштаб.';URL.revokeObjectURL(url)},undefined,err=>{status.textContent='Помилка GLB: '+err.message;URL.revokeObjectURL(url)})};document.getElementById('json').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());status.textContent='Маніфест: '+(d.instances?.length??0)+' вузлів. Виберіть GLB для перегляду.'}catch(err){status.textContent='Помилка JSON: '+err.message}};new ResizeObserver(()=>{const w=el.clientWidth,h=el.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)}).observe(el);</script></html>
