<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P250 — кімната 014 v13.6</title><style>body{margin:0;background:#192427;color:#f1f5f1;font:15px system-ui}header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px;background:#243b37}button,input{background:#39554d;color:white;border:1px solid #6b8b80;border-radius:7px;padding:9px;cursor:pointer}button.active{background:#a7c4aa;color:#14251c}#view{height:calc(100dvh - 140px);min-height:300px}#status{padding:9px 15px;background:#13201e}canvas{display:block}label{display:flex;align-items:center;gap:6px}</style></head><body><header><b>P250 · Кімната 014 · v13.6</b><button data-mode="cut" class="active">Розріз</button><button data-mode="inside">Всередині</button><button data-mode="outside">Зовні</button><label><input id="roof" type="checkbox">Показати стелю</label><label><input id="front" type="checkbox">Показати передню стіну</label><label>Модель GLB <input id="file" type="file" accept=".glb,model/gltf-binary"></label></header><div id="status">Завантаження моделі…</div><div id="view"></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{OrbitControls}from'three/addons/controls/OrbitControls.js';const $=x=>document.getElementById(x),v=$('view'),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(v.clientWidth,v.clientHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.65;v.append(renderer.domElement);const scene=new THREE.Scene();scene.background=new THREE.Color('#253538');const camera=new THREE.PerspectiveCamera(55,v.clientWidth/v.clientHeight,.03,150);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.maxDistance=32;scene.add(new THREE.HemisphereLight(0xf2f6ff,0x8b7964,2.5));for(const [pos,color,intensity] of [[[3,8,7],0xffe5bd,2.6],[[-5,5,1],0xd8eaff,1.8],[[3,4,-3],0xffffff,1.5]]){const l=new THREE.DirectionalLight(color,intensity);l.position.set(...pos);scene.add(l)}let model=null;const frontNames=['ARCH_front_wall_left','ARCH_front_wall_right','ARCH_front_door_lintel','ARCH_door_panel','ARCH_door_frame_L','ARCH_door_frame_R','ARCH_door_frame_top','ARCH_door_handle','ARCH_skirting_front','ARCH_ceiling_cove_front'];function visibility(){if(!model)return;model.traverse(o=>{if(!o.name.startsWith('ARCH_'))return;if(o.name==='ARCH_ceiling_slab'||o.name.startsWith('ARCH_ceiling_light_')||o.name.startsWith('ARCH_ceiling_cove_'))o.visible=$('roof').checked;else if(frontNames.includes(o.name))o.visible=$('front').checked;else o.visible=true})}function viewMode(m){document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));if(m==='cut'){$('roof').checked=false;$('front').checked=false;controls.target.set(2.5,1.15,3);camera.position.set(9,6,-6)}if(m==='inside'){$('roof').checked=true;$('front').checked=true;controls.target.set(2.5,1.4,4.5);camera.position.set(2.5,1.65,1.1)}if(m==='outside'){$('roof').checked=true;$('front').checked=true;controls.target.set(2.5,1.5,3);camera.position.set(9,6,-8)}visibility();controls.update()}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>viewMode(b.dataset.mode));$('roof').onchange=visibility;$('front').onchange=visibility;function load(url){$('status').textContent='Завантаження 3D-сцени…';new GLTFLoader().load(url,g=>{if(model)scene.remove(model);model=g.scene;scene.add(model);viewMode('cut');let count=0;model.traverse(o=>{if(o.isMesh)count++});$('status').textContent='Модель завантажено · '+count+' мешів · ЛКМ — обертати, коліщатко — масштаб, ПКМ — переміщення'},undefined,e=>$('status').textContent='GLB ще не розміщено на сайті. Виберіть файл room_014_architecture.glb із архіву v13.6.')}$('file').onchange=e=>{const f=e.target.files[0];if(f){const url=URL.createObjectURL(f);load(url)}};load('room_014_architecture.glb');new ResizeObserver(()=>{const w=v.clientWidth,h=v.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)}).observe(v);function frame(){requestAnimationFrame(frame);controls.update();renderer.render(scene,camera)}frame();</script></body></html>
